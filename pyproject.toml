[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-topological-insulator"
version = "0.1.0"
description = "Compact numerical implementation of the Su-Schrieffer-Heeger model and its topological invariants."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "fdtdengineer"}]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
